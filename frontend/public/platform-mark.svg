<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wind Forecast Desk mark">
  <title>Wind Forecast Desk mark</title>
  <!-- Frame -->
  <rect x="1" y="1" width="62" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- Forecast: dashed grey line -->
  <polyline points="10,38 22,34 34,28 46,26 54,22" fill="none" stroke="#767676" stroke-width="2.5" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="butt"/>
  <!-- Actual: solid black line -->
  <polyline points="10,46 22,32 34,40 46,20 54,28" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="square"/>
</svg>
