<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 88" width="440" height="88" role="img" aria-label="Wind Forecast Desk logo">
  <title>Wind Forecast Desk logo (demo)</title>
  <!-- Mark -->
  <g transform="translate(0,12) scale(1)">
    <rect x="1" y="1" width="62" height="62" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <polyline points="10,38 22,34 34,28 46,26 54,22" fill="none" stroke="#767676" stroke-width="2.5" stroke-dasharray="4 3" stroke-linejoin="round"/>
    <polyline points="10,46 22,32 34,40 46,20 54,28" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="square"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="84" y="40" font-size="24" font-weight="600" fill="#000000" letter-spacing="-0.4">Wind Forecast Desk</text>
    <text x="84" y="62" font-size="11" fill="#4A4A4A" letter-spacing="1.2">DAY-AHEAD FORECAST ERROR</text>
  </g>
</svg>
